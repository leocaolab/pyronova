name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build + unit tests ────────────────────────────────────────────
  test-unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pytest-asyncio websockets httpx h2 pydantic numpy msgpack watchfiles

      - name: cargo test (Rust compile check)
        env:
          PYO3_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: cargo test

      - name: Build (release)
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Run pytest (unit)
        run: |
          source .venv/bin/activate
          pytest tests/test_mcp.py tests/test_cookies_unit.py tests/test_testclient.py tests/test_rpc.py tests/test_static_files.py tests/test_websocket.py tests/test_async_isolation.py tests/test_logging.py -v

  # ── Integration tests ─────────────────────────────────────────────
  test-integration:
    name: Integration tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: test-unit
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    # Postgres for tests/test_db_pg.py and tests/test_db_subinterp.py, which skip
    # without PYRONOVA_TEST_PG_DSN.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyronova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pytest-asyncio websockets httpx h2 pydantic numpy msgpack watchfiles

      # orjson 3.12.0 is the byte reference for tests/test_isojson_numpy_workers.py
      # (isojson E2E-3); isojson>=0.2 comes with pyronova's own dependencies.
      - name: Install orjson 3.12.0
        run: |
          source .venv/bin/activate
          pip install "orjson==3.12.0"

      - name: Build (release)
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Integration — full pytest suite (GIL + sub-interp)
        env:
          PYRONOVA_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/pyronova_test
        run: |
          source .venv/bin/activate
          # E2E drivers live under tests/e2e/ (not collected by pytest).
          pytest tests/ -q --ignore=tests/e2e

  # ── Rust lint (blocking) ──────────────────────────────────────────
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin the interpreter Pyronova supports (3.14). Without it, the runner's
      # default python3 is picked up and clippy fails on missing ffi symbols
      # (pyo3-ffi gates PyThreadState_GetUnchecked on cfg(Py_3_13)).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        env:
          PYO3_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: cargo clippy --all-targets -- -D warnings
